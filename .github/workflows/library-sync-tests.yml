name: AINotePro library synchronization checks

on:
  push:
    branches:
      - feature/prompt-library-github-sync
  pull_request:
    paths:
      - "ainotepro/**"
      - "tests/test_prompt_bundle_sync.py"
      - "tests/test_github_prompt_sync.py"
      - "tests/test_github_credentials.py"
      - "tests/test_advanced_prompt_store.py"
      - "tests/test_library_import_ui.py"
      - ".github/workflows/library-sync-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q ainotepro
      - name: Test library models, GitHub transport and native credential adapters
        run: |
          python -m unittest discover -s tests -p "test_prompt_bundle_sync.py" -v
          python -m unittest discover -s tests -p "test_github_prompt_sync.py" -v
          python -m unittest discover -s tests -p "test_github_credentials.py" -v
          python -m unittest discover -s tests -p "test_advanced_prompt_store.py" -v
          python -m unittest discover -s tests -p "test_library_import_ui.py" -v
